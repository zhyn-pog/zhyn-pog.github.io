<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to my site!</title>
    <!-- 引入 Darumadrop One 字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Darumadrop+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 背景波点粒子容器 -->
    <div id="particles-container"></div>

    <!-- 鼠标星星掉落画布 -->
    <canvas id="star-canvas"></canvas>

    <!-- 主容器 -->
    <div class="main-container" id="mainContainer">

        <!-- 全宽 Banner 标题 -->
        <div class="title-banner">
            <h1 class="site-title">welcome to my site !</h1>
        </div>

        <!-- 左上角星星 -->
        <div class="star star-top-left">
            <svg viewBox="0 0 100 100" class="star-svg">
                <polygon points="50,5 61,35 95,35 68,57 79,91 50,70 21,91 32,57 5,35 39,35"
                         fill="white" stroke="black" stroke-width="2"/>
            </svg>
        </div>

        <!-- 右下角星星 -->
        <div class="star star-bottom-right">
            <svg viewBox="0 0 100 100" class="star-svg">
                <polygon points="50,5 61,35 95,35 68,57 79,91 50,70 21,91 32,57 5,35 39,35"
                         fill="white" stroke="black" stroke-width="2"/>
            </svg>
        </div>

        <!-- 电脑和便签容器 -->
        <div class="content-wrapper">
            <!-- MacBook 电脑 -->
            <div class="laptop-container" id="laptopContainer">
                <div class="laptop">
                    <!-- 屏幕部分 -->
                    <div class="laptop-screen">
                        <div class="screen-content">
                            <!-- 用户头像占位 -->
                            <div class="avatar-placeholder">
                                <img src="images/avatar.png" alt="Avatar" id="avatarImg" style="display: none;">
                                <div class="avatar-circle" id="avatarCircle"></div>
                            </div>

                            <!-- 登录按钮 -->
                            <button class="login-btn" id="loginBtn">login</button>

                            <!-- 加载动画 -->
                            <div class="loading-container" id="loadingContainer">
                                <div class="loading-bar">
                                    <div class="loading-progress"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- 键盘底座 -->
                    <div class="laptop-base"></div>
                </div>

                <!-- 便签（初始隐藏在屏幕右侧边缘后面） -->
                <div class="sticky-note" id="stickyNote">
                    <div class="note-content">
                        <p class="note-title">TIPS:</p>
                        <p class="note-text">CLICK THE LOGIN BUTTON!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 便签展开后的全屏覆盖层 -->
    <div class="note-overlay" id="noteOverlay">
        <div class="note-expanded-card" id="noteExpandedCard">
            <div class="note-expanded-content">
                <p class="note-expanded-title">TIPS:</p>
                <p class="note-expanded-text">CLICK THE LOGIN BUTTON!</p>
            </div>
            <!-- 返回按钮 -->
            <button class="back-btn" id="backBtn">
                <svg viewBox="0 0 100 100" class="back-btn-svg">
                    <circle cx="50" cy="50" r="45" fill="#F5C518" stroke="#000" stroke-width="4"/>
                    <path d="M65 25 L35 50 L65 75" fill="none" stroke="#000" stroke-width="6"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
