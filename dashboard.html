<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Darumadrop+One&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div id="particles-container"></div>
    <canvas id="star-canvas"></canvas>

    <div class="page-transition" id="pageTransition">
        <div class="dashboard-page" id="dashboardPage">

            <div class="laptop-frame">
                <div class="frame-corner corner-tl"></div>
                <div class="frame-corner corner-tr"></div>
                <div class="frame-corner corner-bl"></div>
                <div class="frame-corner corner-br"></div>
                <div class="frame-keyboard"></div>
            </div>

            <div class="screen-area">

                <div class="character-section">
                    <div class="character-image" id="characterImage" onclick="location.href='aboutme.html'" style="cursor: pointer">
                        <img src="pictur/dashboard_c.PNG" alt="Character" class="character-img character-main">
                        <img src="pictur/aboutme.PNG" alt="About Me" class="character-img character-hover">
                        <!-- 悬停气泡提示 -->
                        <div class="hover-tip">关于我?</div>
                    </div>
                    <div class="character-deco deco-sparkle">
                        <svg viewBox="0 0 100 100" width="30" height="30">
                            <polygon points="50,5 60,40 95,50 60,60 50,95 40,60 5,50 40,40"
                                     fill="white" stroke="black" stroke-width="2"/>
                        </svg>
                    </div>
                </div>

                <div class="dashboard-section">
                    <!-- 绿色斜纹背景卡片 -->
                    <div class="green-card">
                        <div class="green-card-stripes"></div>
                        <!-- 绿色卡片上的白色四角星 -->
                        <div class="green-card-star">
                            <svg viewBox="0 0 100 100" width="72" height="72">
                                <polygon points="50,5 60,40 95,50 60,60 50,95 40,60 5,50 40,40"
                                         fill="white" stroke="#000" stroke-width="2"/>
                            </svg>
                        </div>
                    </div>

                    <!-- 左上角星星 - 白色填充 + 黄色阴影 -->
                    <div class="star-deco star-deco-tl">
                        <svg viewBox="0 0 100 100" width="100" height="100">
                            <polygon points="50,5 61,35 95,35 68,57 79,91 50,70 21,91 32,57 5,35 39,35"
                                     fill="white" stroke="#000" stroke-width="2"/>
                        </svg>
                    </div>

                    <!-- Dashboard面板 -->
                    <div class="dashboard-panel">
                        <!-- 标题 - 向上溢出面板 -->
                        <h1 class="dashboard-title">dashboard</h1>

                        <!-- 白色内框包裹三个按钮 -->
                        <div class="button-box">
                            <button class="dash-btn" onclick="location.href='aboutme.html'">
                                <span class="dash-btn-text">drawing</span>
                                <span class="btn-tip">关于我的画？</span>
                            </button>
                            <button class="dash-btn" id="notebookBtn">
                                <span class="dash-btn-text">notebook</span>
                                <span class="btn-tip">关于我的笔记？</span>
                            </button>
                            <button class="dash-btn" onclick="location.href='thought.html'">
                                <span class="dash-btn-text">thought</span>
                                <span class="btn-tip">关于我的制作想法？</span>
                            </button>
                        </div>
                    </div>

                    <!-- 右下角星星 - 白色阴影 + 最高层级挡按钮边框 -->
                    <div class="star-deco star-deco-br">
                        <svg viewBox="0 0 100 100" width="80" height="80">
                            <polygon points="50,5 61,35 95,35 68,57 79,91 50,70 21,91 32,57 5,35 39,35"
                                     fill="#FFD93D" stroke="#000" stroke-width="2"/>
                        </svg>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- 确认跳转覆盖层 -->
    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-paper">
            <img src="pictur/paper.png" alt="Paper" class="confirm-paper-img">
            <div class="confirm-content">
                <p class="confirm-text">接下来将会导航跳转至我的博客笔记网站，你确定跳转嘛？</p>
                <button class="confirm-btn" id="confirmOkBtn">ok</button>
            </div>
            <!-- 返回按钮 -->
            <button class="confirm-back-btn" id="confirmBackBtn">
                <svg viewBox="0 0 60 60" width="40" height="40">
                    <circle cx="30" cy="30" r="28" fill="#F5C518" stroke="#000" stroke-width="2"/>
                    <path d="M38 18 L22 30 L38 42" fill="none" stroke="#000" stroke-width="4"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
