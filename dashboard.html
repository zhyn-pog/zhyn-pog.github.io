<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <!-- 引入 Darumadrop One 字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Darumadrop+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <!-- 背景波点粒子容器 -->
    <div id="particles-container"></div>

    <!-- 鼠标星星掉落画布 -->
    <canvas id="star-canvas"></canvas>

    <!-- 页面入场动画容器 -->
    <div class="page-transition" id="pageTransition">
        <!-- 整个页面内容 -->
        <div class="dashboard-page" id="dashboardPage">

            <!-- 电脑外框装饰 - 四角 -->
            <div class="laptop-frame">
                <!-- 左上角 -->
                <div class="frame-corner corner-tl"></div>
                <!-- 右上角 -->
                <div class="frame-corner corner-tr"></div>
                <!-- 左下角 -->
                <div class="frame-corner corner-bl"></div>
                <!-- 右下角 -->
                <div class="frame-corner corner-br"></div>
                <!-- 底部键盘装饰条 -->
                <div class="frame-keyboard"></div>
            </div>

            <!-- 屏幕内容区域 -->
            <div class="screen-area">

                <!-- 左侧 - 角色插画区 -->
                <div class="character-section">
                    <!-- 角色占位框（之后上传图片替换） -->
                    <div class="character-placeholder">
                        <div class="placeholder-icon">
                            <svg viewBox="0 0 100 100" width="60" height="60">
                                <circle cx="50" cy="35" r="20" fill="#ccc" stroke="#999" stroke-width="2"/>
                                <ellipse cx="50" cy="80" rx="30" ry="20" fill="#ccc" stroke="#999" stroke-width="2"/>
                            </svg>
                        </div>
                        <p class="placeholder-text">character image</p>
                    </div>
                    <!-- 角色周围装饰 -->
                    <div class="character-deco deco-sparkle">
                        <svg viewBox="0 0 100 100" width="30" height="30">
                            <polygon points="50,5 60,40 95,50 60,60 50,95 40,60 5,50 40,40"
                                     fill="white" stroke="black" stroke-width="2"/>
                        </svg>
                    </div>
                    <div class="character-deco deco-pin">
                        <svg viewBox="0 0 100 100" width="25" height="25">
                            <circle cx="50" cy="35" r="25" fill="#F5C518" stroke="#000" stroke-width="2"/>
                            <rect x="42" y="55" width="16" height="30" rx="3" fill="#F5C518" stroke="#000" stroke-width="2"/>
                        </svg>
                    </div>
                </div>

                <!-- 右侧 - Dashboard面板 -->
                <div class="dashboard-section">
                    <!-- 背景大星星装饰 -->
                    <div class="bg-star bg-star-large">
                        <svg viewBox="0 0 100 100" width="200" height="200">
                            <polygon points="50,5 61,35 95,35 68,57 79,91 50,70 21,91 32,57 5,35 39,35"
                                     fill="white" stroke="#ddd" stroke-width="1"/>
                            <!-- 灰色条纹 -->
                            <line x1="20" y1="20" x2="80" y2="80" stroke="#e0e0e0" stroke-width="3"/>
                            <line x1="30" y1="15" x2="85" y2="70" stroke="#e0e0e0" stroke-width="2"/>
                            <line x1="15" y1="30" x2="70" y2="85" stroke="#e0e0e0" stroke-width="2"/>
                        </svg>
                    </div>

                    <!-- Dashboard面板 -->
                    <div class="dashboard-panel">
                        <!-- 标题 -->
                        <h1 class="dashboard-title">dashboard</h1>

                        <!-- 三个功能按钮 -->
                        <div class="dashboard-buttons">
                            <button class="dash-btn" onclick="location.href='drawing.html'">
                                <span class="dash-btn-text">drawing</span>
                            </button>
                            <button class="dash-btn" onclick="location.href='notebook.html'">
                                <span class="dash-btn-text">notebook</span>
                            </button>
                            <button class="dash-btn" onclick="location.href='thought.html'">
                                <span class="dash-btn-text">thought</span>
                            </button>
                        </div>

                        <!-- 右下角小星星装饰 -->
                        <div class="bg-star bg-star-small">
                            <svg viewBox="0 0 100 100" width="40" height="40">
                                <polygon points="50,5 61,35 95,35 68,57 79,91 50,70 21,91 32,57 5,35 39,35"
                                         fill="#FF9F43" stroke="#000" stroke-width="2"/>
                            </svg>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
